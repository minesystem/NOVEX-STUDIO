
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NOVEX STUDIO V1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090811;color:white;font-family:Arial,sans-serif;overflow:hidden}
button{border:0;border-radius:9px;padding:12px;background:#252036;color:white;font-weight:bold}
button:active{background:#9148ff}
header{height:58px;background:#120e1d;border-bottom:1px solid #302440;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.logo{font-weight:900;color:#bd83ff;font-size:19px}
#status{font-size:11px;color:#9c91aa}
#workspace{position:relative;width:100%;height:calc(100dvh - 58px - 170px)}
#viewport{width:100%;height:100%;display:block}
#toolbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
#toolbar button{padding:10px;font-size:12px}
#bottom{height:170px;background:#120e1d;border-top:1px solid #302440;padding:10px;overflow-y:auto}
.section{font-size:11px;color:#a99ab8;margin:3px 0 9px}
.tools{display:flex;gap:7px;flex-wrap:wrap}
.tools button{flex:1;min-width:65px;font-size:12px}
#objects{margin-top:12px;display:flex;gap:6px;overflow-x:auto}
.object{white-space:nowrap;background:#251d34;padding:8px 12px;border-radius:8px;font-size:12px}
.active{background:#7941c8}
#info{position:absolute;bottom:10px;left:10px;background:#171323dd;padding:8px;border-radius:7px;font-size:11px;color:#c6b4db}
#menu{position:absolute;right:10px;top:10px;display:flex;gap:5px}
#menu button{font-size:11px;padding:9px}
</style>
</head>
<body>

<header>
 <div class="logo">NØV3X STUDIO</div>
 <div id="status">V1 • MOBILE CREATOR</div>
 <button onclick="saveProject()">SAVE</button>
</header>

<div id="workspace">
 <canvas id="viewport"></canvas>

 <div id="toolbar">
  <button onclick="addPart('Box')">＋ BLOCK</button>
  <button onclick="addPart('Sphere')">＋ SPHERE</button>
  <button onclick="addPart('Cylinder')">＋ CYLINDER</button>
 </div>

 <div id="menu">
  <button onclick="resetCamera()">RESET VIEW</button>
 </div>

 <div id="info">Drag to rotate • Pinch to zoom • Tap an object to select</div>
</div>

<div id="bottom">
 <div class="section">BUILDING TOOLS</div>
 <div class="tools">
  <button onclick="addPart('Box')">BLOCK</button>
  <button onclick="addPart('Sphere')">SPHERE</button>
  <button onclick="addPart('Cylinder')">CYLINDER</button>
  <button onclick="deleteSelected()">DELETE</button>
  <button onclick="changeColor()">COLOR</button>
 </div>

 <div class="section" style="margin-top:13px">EXPLORER — OBJECTS</div>
 <div id="objects">
  <span class="object">Workspace</span>
 </div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.js';

const canvas=document.getElementById('viewport');

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x11101c);

const camera=new THREE.PerspectiveCamera(
 65,canvas.clientWidth/canvas.clientHeight,0.1,1000
);
camera.position.set(8,8,12);

const renderer=new THREE.WebGLRenderer({
 canvas,antialias:true,alpha:false
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.target.set(0,0,0);

scene.add(new THREE.HemisphereLight(0xffffff,0x403050,2));

const light=new THREE.DirectionalLight(0xffffff,2);
light.position.set(5,10,5);
scene.add(light);

// Building grid
const grid=new THREE.GridHelper(40,40,0x8650d8,0x393044);
scene.add(grid);

// Ground
const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(40,40),
 new THREE.MeshStandardMaterial({
  color:0x171421,
  roughness:1
 })
);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.03;
scene.add(ground);

let objects=[];
let selected=null;
let colorIndex=0;

const colors=[
 0x9d5cff,
 0x00d9ff,
 0xff4f9a,
 0x45dc85,
 0xffb347,
 0xffffff
];

function addPart(type){
 let geometry;

 if(type==='Box')
  geometry=new THREE.BoxGeometry(2,2,2);

 if(type==='Sphere')
  geometry=new THREE.SphereGeometry(1,32,24);

 if(type==='Cylinder')
  geometry=new THREE.CylinderGeometry(1,1,2,32);

 const material=new THREE.MeshStandardMaterial({
  color:colors[colorIndex],
  roughness:0.65
 });

 const mesh=new THREE.Mesh(geometry,material);

 mesh.position.set(
  Math.round(Math.random()*6-3),
  1,
  Math.round(Math.random()*6-3)
 );

 mesh.userData.name=type+' '+(objects.length+1);

 scene.add(mesh);
 objects.push(mesh);
 selectObject(mesh);
 updateExplorer();
}

function selectObject(obj){
 selected=obj;

 objects.forEach(o=>{
  o.material.emissive.setHex(
   o===selected?0x302040:0x000000
  );
 });

 updateExplorer();
}

function updateExplorer(){
 const list=document.getElementById('objects');
 list.innerHTML='';

 objects.forEach(obj=>{
  const item=document.createElement('button');
  item.className='object'+(obj===selected?' active':'');
  item.textContent=obj.userData.name;

  item.onclick=()=>selectObject(obj);

  list.appendChild(item);
 });
}

function deleteSelected(){
 if(!selected)return;

 scene.remove(selected);
 objects=objects.filter(o=>o!==selected);
 selected=null;
 updateExplorer();
}

function changeColor(){
 if(!selected){
  alert('Select an object first!');
  return;
 }

 colorIndex=(colorIndex+1)%colors.length;
 selected.material.color.setHex(colors[colorIndex]);
}

function resetCamera(){
 camera.position.set(8,8,12);
 controls.target.set(0,0,0);
 controls.update();
}

// Tap objects to select
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();

renderer.domElement.addEventListener('pointerdown',e=>{
 const rect=canvas.getBoundingClientRect();

 pointer.x=((e.clientX-rect.left)/rect.width)*2-1;
 pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;

 raycaster.setFromCamera(pointer,camera);

 const hits=raycaster.intersectObjects(objects);

 if(hits.length){
  selectObject(hits[0].object);
 }
});

function resize(){
 const w=canvas.clientWidth;
 const h=canvas.clientHeight;

 camera.aspect=w/h;
 camera.updateProjectionMatrix();

 renderer.setSize(w,h,false);
}

window.addEventListener('resize',resize);
resize();

// Save project
function saveProject(){
 const data={
  name:'NOVEX STUDIO PROJECT',
  version:1,
  objects:objects.map(o=>({
   type:o.geometry.type,
   name:o.userData.name,
   position:o.position.toArray(),
   rotation:o.rotation.toArray(),
   scale:o.scale.toArray(),
   color:o.material.color.getHex()
  }))
 };

 localStorage.setItem('novex_project',JSON.stringify(data));

 alert('Project saved on this device!');
}

window.saveProject=saveProject;
window.addPart=addPart;
window.deleteSelected=deleteSelected;
window.changeColor=changeColor;
window.resetCamera=resetCamera;

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();

// Load previous project
const saved=localStorage.getItem('novex_project');

if(saved){
 try{
  const data=JSON.parse(saved);

  data.objects.forEach(o=>{
   let type=o.type==='SphereGeometry'?'Sphere':
    o.type==='CylinderGeometry'?'Cylinder':'Box';

   let geometry=type==='Sphere'
    ?new THREE.SphereGeometry(1,32,24):
    type==='Cylinder'
    ?new THREE.CylinderGeometry(1,1,2,32):
    new THREE.BoxGeometry(2,2,2);

   const mesh=new THREE.Mesh(
    geometry,
    new THREE.MeshStandardMaterial({color:o.color})
   );

   mesh.position.fromArray(o.position);
   mesh.rotation.fromArray(o.rotation);
   mesh.scale.fromArray(o.scale);
   mesh.userData.name=o.name;

   scene.add(mesh);
   objects.push(mesh);
  });

  updateExplorer();
 }catch(e){
  console.log('Could not load saved project',e);
 }
}
</script>
</body>
</html>
